<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1920 1080" width="1920" height="1080" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#FFB05A"/>
<stop offset="0.5" stop-color="#FF7A1F"/>
<stop offset="1" stop-color="#E5500A"/>
</linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
<stop offset="0" stop-color="#FFE3C2" stop-opacity="0.45"/>
<stop offset="1" stop-color="#FFE3C2" stop-opacity="0"/>
</radialGradient>
<pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse">
<circle cx="4" cy="4" r="2" fill="#FFFFFF" fill-opacity="0.16"/>
</pattern>
<filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
<feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#7C2D05" flood-opacity="0.35"/>
</filter>

<g id="pencil">
<rect x="0" y="0" width="40" height="36" rx="9" fill="#FDA4AF"/>
<rect x="40" y="0" width="24" height="36" fill="#CBD5E1"/>
<rect x="46" y="0" width="3" height="36" fill="#94A3B8"/>
<rect x="55" y="0" width="3" height="36" fill="#94A3B8"/>
<rect x="64" y="0" width="250" height="36" fill="currentColor"/>
<rect x="64" y="22" width="250" height="14" fill="#000" fill-opacity="0.14"/>
<rect x="64" y="5" width="250" height="5" fill="#fff" fill-opacity="0.35"/>
<polygon points="314,0 372,18 314,36" fill="#F8D7B0"/>
<polygon points="314,18 372,18 314,36" fill="#000" fill-opacity="0.08"/>
<polygon points="350,10 372,18 350,26" fill="#374151"/>
</g>

<g id="eraser">
<rect x="0" y="0" width="130" height="64" rx="12" fill="#FFF7ED"/>
<rect x="0" y="0" width="130" height="64" rx="12" fill="none" stroke="#FDBA74" stroke-width="2"/>
<rect x="34" y="-2" width="62" height="68" fill="#9A3412"/>
<rect x="34" y="-2" width="62" height="12" fill="#fff" fill-opacity="0.18"/>
<rect x="44" y="26" width="42" height="12" rx="6" fill="#FFF7ED" fill-opacity="0.85"/>
</g>

<g id="eraser-pink">
<rect x="0" y="0" width="110" height="60" rx="14" fill="#FDA4AF"/>
<path d="M0 30 H110" stroke="#fff" stroke-opacity="0.3" stroke-width="2"/>
<rect x="8" y="8" width="94" height="10" rx="5" fill="#fff" fill-opacity="0.35"/>
</g>

<g id="clip" fill="none" stroke="#E2E8F0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
<path d="M10 90 V20 a20 20 0 0 1 40 0 V100 a14 14 0 0 1 -28 0 V34"/>
</g>
</defs>

<rect width="1920" height="1080" fill="url(#bg)"/>
<rect width="1920" height="1080" fill="url(#dots)"/>
<rect width="1920" height="1080" fill="url(#glow)"/>
<circle cx="1700" cy="-40" r="360" fill="#FFD3A0" fill-opacity="0.18"/>
<circle cx="-60" cy="1100" r="420" fill="#B93A06" fill-opacity="0.22"/>
<circle cx="1500" cy="1160" r="300" fill="#FFD3A0" fill-opacity="0.12"/>

<!-- Bloco de notas com checklist (esquerda) -->
<g transform="translate(110 110) rotate(-7)" filter="url(#sh)">
<rect x="0" y="0" width="380" height="500" rx="20" fill="#FFF7ED"/>
<rect x="0" y="0" width="380" height="64" rx="20" fill="#9A3412"/>
<rect x="0" y="40" width="380" height="24" fill="#9A3412"/>
<g fill="#FFF7ED"><circle cx="50" cy="30" r="9"/><circle cx="110" cy="30" r="9"/><circle cx="170" cy="30" r="9"/><circle cx="230" cy="30" r="9"/><circle cx="290" cy="30" r="9"/><circle cx="350" cy="30" r="9"/></g>
<g stroke="#9A3412" stroke-width="6" stroke-linecap="round"><path d="M50 14 V34 M110 14 V34 M170 14 V34 M230 14 V34 M290 14 V34 M350 14 V34" stroke-opacity="0.6"/></g>
<g fill="none" stroke="#FDBA74" stroke-width="3">
<rect x="36" y="110" width="34" height="34" rx="9" fill="#FF7A1F" stroke="#FF7A1F"/>
<rect x="36" y="190" width="34" height="34" rx="9" fill="#FF7A1F" stroke="#FF7A1F"/>
<rect x="36" y="270" width="34" height="34" rx="9"/>
<rect x="36" y="350" width="34" height="34" rx="9"/>
<rect x="36" y="430" width="34" height="34" rx="9"/>
</g>
<g fill="none" stroke="#FFF7ED" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
<path d="M45 128 l9 10 l12 -18"/><path d="M45 208 l9 10 l12 -18"/>
</g>
<g stroke-linecap="round" stroke-width="10">
<path d="M96 127 H320" stroke="#FDBA74"/><path d="M96 207 H290" stroke="#FDBA74"/>
<path d="M96 287 H330" stroke="#FED7AA"/><path d="M96 367 H280" stroke="#FED7AA"/><path d="M96 447 H310" stroke="#FED7AA"/>
</g>
<path d="M92 127 H324 M92 207 H294" stroke="#C2410C" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round"/>
</g>
<use href="#clip" transform="translate(405 100) rotate(8)" filter="url(#sh)"/>

<!-- Post-it (canto superior direito) -->
<g transform="translate(1560 90) rotate(6)" filter="url(#sh)">
<rect width="230" height="230" rx="10" fill="#FDE68A"/>
<path d="M0 200 Q115 210 230 190 V230 H0 Z" fill="#000" fill-opacity="0.06"/>
<g stroke="#B45309" stroke-opacity="0.55" stroke-width="8" stroke-linecap="round"><path d="M34 62 H190"/><path d="M34 108 H160"/><path d="M34 154 H176"/></g>
</g>

<!-- Lápis: canto inferior esquerdo -->
<use href="#pencil" color="#FBBF24" transform="translate(40 870) rotate(-22)" filter="url(#sh)"/>
<use href="#pencil" color="#9A3412" transform="translate(130 950) rotate(-14)" filter="url(#sh)"/>
<use href="#pencil" color="#FFF7ED" transform="translate(300 1000) rotate(-6)" filter="url(#sh)"/>

<!-- Lápis: canto superior direito -->
<use href="#pencil" color="#FFF7ED" transform="translate(1500 420) rotate(38)" filter="url(#sh)"/>
<use href="#pencil" color="#FBBF24" transform="translate(1560 500) rotate(30)" filter="url(#sh)"/>

<!-- Borrachas: canto inferior direito -->
<use href="#eraser" transform="translate(1590 860) rotate(16)" filter="url(#sh)"/>
<use href="#eraser-pink" transform="translate(1460 930) rotate(-12)" filter="url(#sh)"/>
<use href="#eraser-pink" transform="translate(1760 740) rotate(-24)" filter="url(#sh)"/>
<use href="#eraser" transform="translate(120 700) rotate(-30) scale(0.8)" filter="url(#sh)"/>

<!-- Detalhes: farelo de borracha -->
<g fill="#FFF7ED" fill-opacity="0.85">
<rect x="1560" y="960" width="16" height="8" rx="4" transform="rotate(20 1560 960)"/>
<rect x="1710" y="990" width="12" height="7" rx="3" transform="rotate(-30 1710 990)"/>
<rect x="1420" y="880" width="12" height="6" rx="3" transform="rotate(50 1420 880)"/>
</g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
